<title>Felix Plaza 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed model; floor buttons on the left edge, tools on the right edge, one panel at a time. Single light look. */
:root{
  --bg:#eceee9; --panel:#ffffff; --panel-2:#f3f5f1; --ink:#1c2321; --muted:#5d6763; --faint:#8d9692; --line:#dce1db;
  --accent:#1d6b64; --accent-ink:#ffffff; --accent-soft:#dbeeea;
  --s-signed:#2f9e5a; --s-near:#e3782b; --s-discussion:#4a8fd4; --s-vacant:#a3aba7;
  --scene-bg:#e7eae5; --scene-floor:#f8f7f3; --scene-line:#7d8581; --scene-wall:#f4f2ec; --scene-slab:#cdd1ca; --scene-boh:#cfd3cc; --scene-fascia:#2b302e;
  --shadow:0 1px 2px rgba(20,30,28,.06),0 6px 22px rgba(20,30,28,.10);
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"Archivo Narrow","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --top:calc(14px + env(safe-area-inset-top,0px)); --bot:calc(14px + env(safe-area-inset-bottom,0px));
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
#stage{position:fixed;inset:0;background:var(--scene-bg)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ui{position:fixed;z-index:5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.eyebrow{font-family:var(--f-label);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:#b8402c}
.btn svg,.icon svg,.tool svg,.seg svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon{width:36px;height:36px;padding:0;display:inline-grid;place-items:center;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.icon:hover{background:var(--panel-2)}
:is(.btn,.icon,.tool,.seg button,.fl,.chip,.res,.tile,.li):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;height:32px;padding:0 13px;border-radius:7px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg.small button{height:28px;padding:0 10px;font-size:12.5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;background:var(--sc,var(--faint))}
.s-signed{--sc:var(--s-signed)} .s-near{--sc:var(--s-near)} .s-discussion{--sc:var(--s-discussion)} .s-vacant{--sc:var(--s-vacant)}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--sc) 15%,#fff);color:color-mix(in srgb,var(--sc) 65%,var(--ink))}
input[type=text],input[type=search],select,textarea{width:100%;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);padding:0 11px;font-size:13.5px}
textarea{height:70px;padding:8px 11px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=range]{width:100%;accent-color:var(--accent)}
label.field{display:grid;gap:6px;font-size:12.5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:color-mix(in srgb,var(--sc,var(--accent)) 50%,var(--line));background:color-mix(in srgb,var(--sc,var(--accent)) 10%,#fff)}

/* top left: mark + search */
#find{top:var(--top);left:var(--gl);display:flex;gap:8px;align-items:center;padding:6px;width:min(380px,calc(100vw - 32px))}
#find .mark{height:36px;padding:0 10px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--f-label);font-weight:700;font-size:14px;letter-spacing:.05em;flex:none;white-space:nowrap}
#find input{border:0;background:transparent;height:36px;padding:0 6px;font-size:14px}
#find input:focus{outline:none}
#results{top:calc(var(--top) + 56px);left:var(--gl);width:min(380px,calc(100vw - 32px));max-height:min(60vh,520px);overflow:auto;padding:6px}
.res{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:8px 9px;border-radius:8px;cursor:pointer}
.res:hover,.res.on{background:var(--panel-2)}
.res b{font-weight:600;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res span{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.resh{font-family:var(--f-label);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 9px 4px;font-weight:600}

#modes{top:var(--top);left:50%;transform:translateX(-50%);padding:5px}
#corner{top:var(--top);right:var(--gr);display:flex;gap:6px;padding:5px}

/* floors (left edge) */
#floorbar{left:var(--gl);top:50%;transform:translateY(-50%);display:grid;gap:4px;padding:6px}
.fl{width:52px;height:44px;border-radius:9px;border:1px solid transparent;background:none;cursor:pointer;display:grid;place-items:center;font-family:var(--f-label);font-weight:700;font-size:15px;color:var(--ink);position:relative}
.fl:hover{background:var(--panel-2)}
.fl[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.fl.all{font-size:12px;letter-spacing:.04em;height:34px;color:var(--muted)}
.fl.all[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.fl .tipx{position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;font-family:var(--f-ui);font-weight:500;font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
.fl:hover .tipx{opacity:1}

/* tools (right edge) */
#tools{right:var(--gr);top:50%;transform:translateY(-50%);display:grid;gap:2px;padding:6px}
.tool{width:60px;min-height:54px;border-radius:9px;border:0;background:none;cursor:pointer;display:grid;justify-items:center;align-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--muted);padding:6px 2px}
.tool:hover{background:var(--panel-2);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tool svg{width:20px;height:20px}
#panel{right:calc(var(--gr) + 84px);top:calc(var(--top) + 60px);width:330px;max-height:calc(100% - 150px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:hidden}
#panel .ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 10px 16px;border-bottom:1px solid var(--line)}
#panel .ph .eyebrow{color:var(--ink)}
.pane{padding:16px;overflow:auto;display:grid;gap:14px;align-content:start}
.pane h2{margin:0;font-family:var(--f-label);font-size:24px;font-weight:700;letter-spacing:.02em;line-height:1.1;text-wrap:balance}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-family:var(--f-mono);font-size:12.5px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.sep{height:1px;background:var(--line)}
.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 6px;display:grid;justify-items:center;gap:5px;cursor:pointer;font-size:11.5px;text-align:center;line-height:1.2;min-height:72px}
.tile:hover{background:var(--panel-2)}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tile svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.list{display:grid;gap:5px}
.li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:var(--panel);text-align:left;width:100%;cursor:default}
button.li{cursor:pointer} button.li:hover{background:var(--panel-2)}
.li small{color:var(--muted);font-size:11.5px;display:block}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:9px;counter-reset:s}
.steps li{display:grid;grid-template-columns:24px 1fr;gap:9px;font-size:13.5px;line-height:1.4}
.steps li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11.5px;font-weight:700;font-family:var(--f-mono)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);cursor:pointer}
.swatches button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.empty{padding:6px 2px;color:var(--muted);font-size:13px;line-height:1.5}
.optrow{display:grid;gap:7px}
.stbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.stbl th{font-family:var(--f-label);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:0 0 6px 6px;white-space:nowrap}
.stbl th:first-child,.stbl td:first-child{text-align:left;padding-left:0}
.stbl td{text-align:right;padding:7px 0 7px 6px;border-top:1px solid var(--line);vertical-align:top;white-space:nowrap}
.stbl td small{display:block;color:var(--faint);font-size:10.5px;font-family:var(--f-mono)}
.stbl tr.tot td{font-weight:700;border-top:0;background:var(--panel-2)}
.stbl tr.tot td:first-child{padding-left:8px;border-radius:8px 0 0 8px} .stbl tr.tot td:last-child{padding-right:8px;border-radius:0 8px 8px 0}
.stbl tr.cur td:first-child{color:var(--accent);font-weight:700}
.stbl .bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);margin-top:5px;width:100%}
.stbl .bar i{display:block;height:100%;background:var(--sc)}
#panel.wide{width:min(560px,calc(100vw - 32px))}
#legend{cursor:pointer}
#legend b{font-family:var(--f-mono);font-weight:500;font-size:12px}

/* bottom */
#legend{left:var(--gl);bottom:var(--bot);padding:8px 12px;display:flex;gap:14px;align-items:center;font-size:12.5px;flex-wrap:wrap}
#legend span{display:inline-flex;gap:6px;align-items:center}
#zoom{right:var(--gr);bottom:var(--bot);display:grid;gap:4px;padding:5px}
#hint{left:50%;transform:translateX(-50%);bottom:var(--bot);padding:8px 14px;font-size:12.5px;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:min(760px,calc(100vw - 32px))}
#hint b{color:var(--ink);font-weight:600}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel-2);color:var(--ink)}
#minimap{right:var(--gr);bottom:var(--bot);padding:8px;width:min(340px,42vw);display:grid;gap:6px}
#minimap.big{width:min(72vh,calc(100vw - 32px))}
#minimap .mmh{display:flex;align-items:center;justify-content:space-between;gap:6px}
#minimap .mmh b{font-family:var(--f-label);font-size:14px;letter-spacing:.03em}
#minimap canvas{width:100%;aspect-ratio:1;border-radius:8px;display:block;cursor:crosshair;background:var(--panel-2)}
#cross{position:fixed;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;z-index:6;pointer-events:none;display:none}
#cross::before,#cross::after{content:"";position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.55)}
#cross::before{left:10px;top:2px;width:2px;height:18px} #cross::after{top:10px;left:2px;height:2px;width:18px}
body.locked #cross{display:block}
#look{position:fixed;left:50%;top:calc(50% + 22px);transform:translateX(-50%);z-index:6;pointer-events:none;font-size:13px;font-weight:600;padding:4px 10px;border-radius:7px;background:rgba(28,35,33,.82);color:#fff;white-space:nowrap;display:none}
#toast{left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 56px);padding:9px 14px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
#tip{position:fixed;z-index:8;pointer-events:none;display:none;font-size:12.5px;font-weight:600;padding:5px 9px;border-radius:7px;background:var(--ink);color:#fff;white-space:nowrap;transform:translate(14px,14px)}
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:var(--bg);transition:opacity .4s}
#loading .box{display:grid;gap:10px;justify-items:center;text-align:center;padding:24px}
#loading .meter{width:220px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
#loading .meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#present{left:50%;transform:translateX(-50%);bottom:var(--bot);padding:6px;display:none;gap:6px;align-items:center}
#present .ttl{min-width:200px;text-align:center;font-family:var(--f-label);font-weight:700;letter-spacing:.03em;font-size:15px;padding:0 8px}
#joy{position:fixed;left:calc(84px + env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.7);display:none;z-index:6;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--accent);opacity:.85}

/* mode-dependent visibility */
body.walking #legend,body.walking #zoom{display:none}
body.walking #tools{top:calc(var(--top) + 58px);transform:none}
body:not(.walking) #minimap{display:none}
body.walking.touch #joy{display:block}
body.uihidden #find,body.uihidden #results,body.uihidden #tools,body.uihidden #panel,body.uihidden #legend,body.uihidden #hint{display:none!important}
body.presenting .ui:not(#present):not(#toast){display:none!important}
body.presenting #present{display:flex}
body.tool .ul,body.tool .pin,body.tool .el{pointer-events:none}

/* 3D labels */
.ul{pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.94);border:1px solid rgba(0,0,0,.08);box-shadow:0 1px 4px rgba(0,0,0,.12);white-space:nowrap;transition:opacity .15s;transform:translateY(-50%)}
.ul i{width:8px;height:8px;border-radius:50%;background:var(--lc,#999);flex:none}
.ul b{font-family:var(--f-label);font-size:12.5px;font-weight:700;letter-spacing:.03em;line-height:1.15;color:#1c2321}
.ul span{font-family:var(--f-mono);font-size:10.5px;color:#5d6763}
.ul.nodot i{display:none}
.ul.hid{opacity:0;pointer-events:none}
.ul.sel{outline:2px solid var(--accent);outline-offset:1px}
.ul.dim{opacity:.22}
.ftag{font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:7px;background:var(--ink);color:#fff;white-space:nowrap;pointer-events:auto;cursor:pointer}
.el{pointer-events:auto;cursor:pointer;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--ink);color:#fff;white-space:nowrap;transform:translateY(-100%)}
.el.note{background:#fff7d6;color:#3b3108;border:1px solid #e9d27c;max-width:230px;white-space:normal;font-weight:500;line-height:1.35}
.mlabel{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border-radius:6px;background:var(--accent);color:#fff;white-space:nowrap}
.pin{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent);color:#fff;white-space:nowrap;pointer-events:auto;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.pin.esc{background:#fff;color:var(--ink);border:1px solid var(--line)}

@media (max-width: 760px){
  #modes{top:auto;bottom:var(--bot)} #modes .seg button span{display:none}
  #find{width:calc(100vw - 32px - 104px)} #find .mark{display:none} #b-ui{width:36px;padding:0} #b-ui span{display:none} .ftag{display:none}
  #results{width:calc(100vw - 32px)}
  #floorbar{top:auto;bottom:calc(var(--bot) + 64px);transform:none} .fl{width:44px;height:38px;font-size:13px} .fl .tipx{display:none}
  #tools{top:auto;bottom:calc(var(--bot) + 64px);transform:none} .tool{width:48px;min-height:44px;font-size:0;gap:0} .tool span{display:none}
  #panel{left:var(--gl);right:var(--gr);width:auto;top:auto;bottom:calc(var(--bot) + 64px);max-height:55%}
  #legend,#hint,#zoom{display:none!important}
  #minimap{width:46vw;bottom:calc(var(--bot) + 64px)}
  #joy{left:calc(70px + env(safe-area-inset-left,0px));bottom:calc(var(--bot) + 70px)}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<div id="stage"><div id="labels"></div></div>
<div id="cross"></div><div id="look"></div>

<div id="loading"><div class="box"><div class="eyebrow">Felix Plaza</div><div style="font-size:15px;font-weight:600">Building the 3D model</div><div class="meter"><i id="meter"></i></div><div class="hint" id="loadmsg">Loading floor plans</div></div></div>

<div id="find" class="ui card">
  <div class="mark" title="Felix Plaza &middot; Brand zoning, 10 Oct 2026">FELIX PLAZA</div>
  <input type="search" id="q" placeholder="Find a shop or unit" aria-label="Find a shop or unit" autocomplete="off">
</div>
<div id="results" class="ui card" hidden></div>

<div id="modes" class="ui card">
  <div class="seg" role="group" aria-label="View">
    <button id="m-overview" aria-pressed="true" title="3D view (1)"><svg viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg><span>3D</span></button>
    <button id="m-plan" aria-pressed="false" title="Plan, like the printed drawing (2)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M4 12h8V4M12 16v4"/></svg><span>Plan</span></button>
    <button id="m-walk" aria-pressed="false" title="Walk inside (3)"><svg viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="1.8"/><path d="m9 21 2.5-6 2.5 2v4M8 11l3-3 3 1 2 3M11 8l-1 5"/></svg><span>Walk</span></button>
  </div>
</div>

<div id="corner" class="ui card">
  <button class="icon" id="b-shot" title="Save a picture of this view"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
  <button class="btn" id="b-ui" title="Hide or show the panels (H)"><svg viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="2.5"/></svg><span id="b-ui-t">Hide panels</span></button>
</div>
